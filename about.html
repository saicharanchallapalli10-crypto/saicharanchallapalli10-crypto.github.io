<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>About Me</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #212121;
      color: #ececec;
      font-family: 'Inter', sans-serif;
      height: 100vh;
    }

    nav {
      position: fixed;
      left: 2rem;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    nav a {
      color: #ececec;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 300;
      transition: color 0.2s;
    }

    nav a:hover { color: #fff; }

    .content {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.4rem;
      text-align: center;
    }

    .content h1 {
      font-size: 1rem;
      font-weight: 400;
      color: #ececec;
    }

    .content p {
      font-size: 0.85rem;
      font-weight: 300;
      color: #888;
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">← Back</a>
  </nav>

  <div class="content">
    <h1>SaiCharan Challapalli</h1>
    <p>Northeastern University</p>

  </div>

</body>

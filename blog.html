<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blog</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #212121;
      color: #ececec;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .page {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }

    .page h1 {
      font-size: clamp(2.5rem, 5vw, 4rem);
      font-weight: 500;
      letter-spacing: 0.05em;
    }

    .posts {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 320px;
    }

    .posts a {
      font-size: clamp(1.4rem, 3vw, 2.4rem);
      font-weight: 400;
      color: #ececec;
      text-decoration: none;
      padding: 0.5rem 0;
      border-bottom: 1px solid #444;
      transition: color 0.2s;
    }

    .posts a:hover {
      color: #fff;
    }

    .footer {
      display: flex;
      gap: 1rem;
      font-size: 0.9rem;
    }

    .footer a {
      color: #888;
      text-decoration: none;
      font-weight: 300;
    }

    .footer a:hover {
      color: #fff;
    }
  </style>
</head>
<body>

  <div class="page">
    <h1>Blog</h1>
    <div class="posts">
      <a href="apple-the-air-inside.html">Apple: The Air Inside</a>
    </div>
    <div class="footer">
      <a href="index.html">Home</a>
      <a href="about.html">About Me</a>
    </div>
  </div>

</body>
</html>

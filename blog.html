<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blog</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #212121;
      color: #ececec;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .center-links {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      text-align: center;
    }

    .center-links a {
      color: #ececec;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 400;
      transition: color 0.2s;
    }

    .center-links a:hover { color: #fff; }

    .top-links {
      position: absolute;
      top: 1.5rem;
      left: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      font-size: 0.85rem;
    }

    .top-links a {
      color: #ececec;
      text-decoration: none;
      font-weight: 300;
      transition: color 0.2s;
    }

    .top-links a:hover { color: #fff; }
  </style>
</head>
<body>

  <div class="top-links">
    <a href="index.html">Home</a>
    <a href="about.html">About Me</a>
  </div>

  <div class="center-links">
    <a href="apple-the-air-inside.html">Apple: The Air Inside</a>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blog</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #212121;
      color: #ececec;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      min-height: 100vh;
      position: relative;
      padding: 2rem 3rem;
    }

    nav {
      position: absolute;
      top: 2rem;
      left: 2rem;
    }

    nav a {
      color: #ececec;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 400;
      transition: color 0.2s;
    }

    nav a:hover { color: #fff; }

    .title {
      position: absolute;
      top: 2.5rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      text-align: center;
    }

    .articles {
      position: absolute;
      top: 8rem;
      left: 3rem;
    }

    .articles ul {
      padding-left: 1.5rem;
    }

    .articles li {
      color: #ececec;
      font-size: 1rem;
      margin-bottom: 1rem;
    }

    .articles a {
      color: #ececec;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 400;
      transition: color 0.2s;
    }

    .articles a:hover { color: #fff; }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">Back</a>
  </nav>

  <div class="title">
    Collection
  </div>

  <div class="articles">
    <ul>
      <li><a href="apple-the-air-inside.html">Apple: The Air Inside</a></li>
    </ul>
  </div>

</body>
</html>

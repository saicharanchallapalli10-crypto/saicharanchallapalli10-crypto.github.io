<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My Site</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #212121;
      color: #ececec;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    nav {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      text-align: center;
    }

    nav a {
      color: #ececec;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 300;
      transition: color 0.2s;
    }

    nav a:hover { color: #fff; }

    .about {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
    }

    .about p {
      font-size: 0.8rem;
      font-weight: 300;
      color: #888;
    }

    .about {
      display: none;
      flex-direction: column;
      gap: 0.3rem;
      margin-top: 0.5rem;
    }

    .about.visible { display: flex; }
  </style>
</head>
<body>

  <nav>
    <a href="blog.html">Blog</a>
    <a href="about.html">About Me</a>
  </nav>

</body>
</html>
